<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0d1117">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icons/agent.svg" type="image/svg+xml">
    <title>TSDI Agent Web Console</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #0d1117;
            color: #c9d1d9;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        }
        #agent-console {
            height: 100vh;
            height: 100dvh;
            overflow: auto;
            box-sizing: border-box;
            padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
            overscroll-behavior: contain;
        }
        #agent-console .console-panel {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            margin-bottom: 10px;
            padding: 10px;
        }
        #agent-console .console-brand-panel {
            position: sticky;
            top: 0;
            z-index: 2;
        }
        #agent-console textarea.agent-input {
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
            display: block;
            background: #0d1117;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 4px;
            padding: 8px;
            resize: vertical;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            box-shadow: none;
            appearance: none;
        }
        #agent-console textarea.agent-input:focus {
            border-color: #58a6ff;
        }
        #agent-header {
            position: sticky;
            top: 0;
            z-index: 3;
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 8px 12px;
            background: #161b22;
            border-bottom: 1px solid #30363d;
        }
        #agent-header select {
            flex: 1 1 auto;
            min-width: 0;
            background: #0d1117;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 4px;
            padding: 6px 8px;
            font: inherit;
        }
        #agent-header button {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 4px;
            padding: 6px 10px;
            font: inherit;
            cursor: pointer;
        }
        #agent-header button:hover {
            border-color: #58a6ff;
        }
        #agent-header-status {
            color: #8b949e;
            font-size: 12px;
            white-space: nowrap;
        }
        @media (max-width: 640px) {
            #agent-console {
                padding-top: max(8px, env(safe-area-inset-top));
                padding-bottom: max(8px, env(safe-area-inset-bottom));
            }
            #agent-console .console-panel {
                margin-bottom: 8px;
                padding: 8px;
            }
            #agent-console textarea.agent-input,
            #agent-console button,
            #agent-console select {
                min-height: 44px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <header id="agent-header">
        <select id="agent-session-select" aria-label="Session"></select>
        <button id="agent-session-new" type="button">+ New</button>
        <span id="agent-header-status"></span>
    </header>
    <div id="agent-console"></div>
    <script src="./header.js"></script>
</body>
</html>
