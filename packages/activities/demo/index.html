<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TSDI Workflow Designer Demo</title>
    <link rel="stylesheet" href="./codemirror.css" />
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            background: #0f172a;
            color: #e2e8f0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
        }
        .demo-header {
            padding: 12px 18px;
            background: #111c33;
            border-bottom: 1px solid #1e293b;
            display: flex;
            align-items: baseline;
            gap: 12px;
            flex-wrap: wrap;
        }
        .demo-header h1 {
            margin: 0;
            font-size: 15px;
            color: #f8fafc;
        }
        .demo-header p {
            margin: 0;
            font-size: 11px;
            color: #94a3b8;
        }
        .demo-lang {
            margin-left: auto;
            display: flex;
            gap: 6px;
        }
        .demo-lang button {
            border: 1px solid #334155;
            border-radius: 6px;
            background: #0b1220;
            color: #cbd5e1;
            font-size: 11px;
            padding: 4px 9px;
            cursor: pointer;
        }
        .demo-lang button:hover {
            border-color: #60a5fa;
            color: #ffffff;
        }
        #boot-status {
            padding: 18px;
            font-size: 13px;
            color: #93c5fd;
        }
        #workflow-app {
            flex: 1;
            min-height: 0;
            background: #f8fafc;
            color: #0f172a;
        }
        #workflow-app > workflow-designer {
            display: block;
            height: 100%;
        }
    </style>
</head>
<body>
    <header class="demo-header">
        <h1>TSDI Workflow Designer</h1>
        <p>Drag nodes · connect ports · run and inspect path / history / logs</p>
        <div class="demo-lang">
            <button id="lang-en">EN</button>
            <button id="lang-zh">中文</button>
        </div>
    </header>
    <div id="boot-status">Loading demo bundle…</div>
    <div id="workflow-app"></div>
    <script src="./main.js"></script>
</body>
</html>
