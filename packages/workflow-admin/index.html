<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" href="data:," />
    <title>TSDI Workflow Admin</title>
    <link rel="stylesheet" href="./codemirror.css" />
    <link rel="stylesheet" href="./codemirror-hint.css" />
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            background: #0f172a;
            color: #e2e8f0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
        }
        .designer-header {
            padding: 12px 18px;
            background: #111c33;
            border-bottom: 1px solid #1e293b;
            display: flex;
            align-items: baseline;
            gap: 12px;
            flex-wrap: wrap;
        }
        .designer-header h1 {
            margin: 0;
            font-size: 15px;
            color: #f8fafc;
        }
        .designer-header p {
            margin: 0;
            font-size: 11px;
            color: #94a3b8;
        }
        .designer-lang {
            margin-left: auto;
            margin-right: 40px;
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .workflow-management-menu {
            position: fixed;
            top: 8px;
            right: 16px;
            z-index: 80;
        }
        .workflow-management-menu .menu-bar-trigger {
            min-height: 28px;
        }
        .designer-auth[hidden] {
            display: none !important;
        }
        .designer-auth {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: 8px;
            color: #cbd5e1;
            font-size: 11px;
        }
        .designer-auth button {
            border: 1px solid #334155;
            border-radius: 6px;
            background: #0b1220;
            color: #cbd5e1;
            font-size: 11px;
            padding: 4px 9px;
            cursor: pointer;
        }
        .designer-auth button:hover {
            border-color: #60a5fa;
            color: #ffffff;
        }
        .designer-lang button {
            border: 1px solid #334155;
            border-radius: 6px;
            background: #0b1220;
            color: #cbd5e1;
            font-size: 11px;
            padding: 4px 9px;
            cursor: pointer;
        }
        .designer-lang button:hover {
            border-color: #60a5fa;
            color: #ffffff;
        }
        #boot-status {
            padding: 18px;
            font-size: 13px;
            color: #93c5fd;
        }
        #workflow-app {
            flex: 1;
            min-height: 0;
            background: #f8fafc;
            color: #0f172a;
        }
        #workflow-app > workflow-designer,
        #workflow-app > workflow-admin-shell,
        #workflow-app workflow-admin-shell,
        #workflow-app workflow-admin-shell > router-outlet,
        #workflow-app workflow-admin-designer,
        #workflow-app workflow-designer {
            display: block;
            height: 100%;
            min-height: 0;
        }
        .wa-login {
            height: 100%;
            display: grid;
            place-items: center;
            padding: 24px;
            background: radial-gradient(circle at 20% 10%, #1e3a5f, #0b1220 55%);
        }
        .wa-login-card {
            width: min(420px, calc(100vw - 32px));
            padding: 28px;
            border: 1px solid #334155;
            border-radius: 16px;
            background: rgba(15, 23, 42, 0.94);
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
        }
        .wa-login-card h1 { margin: 0 0 6px; font-size: 20px; }
        .wa-login-card p { margin: 0 0 20px; color: #94a3b8; font-size: 12px; }
        .wa-login-card button,
        .wa-login-card input {
            width: 100%;
            padding: 10px 12px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0b1220;
            color: #e2e8f0;
            font-size: 13px;
        }
        .wa-login-card button { cursor: pointer; }
        .wa-login-card button.wa-primary { background: #2563eb; border-color: #2563eb; color: #fff; font-weight: 600; }
        .wa-login-card label { display: block; margin-top: 12px; color: #cbd5e1; font-size: 11px; }
        .wa-divider { display: flex; align-items: center; gap: 10px; color: #64748b; font-size: 11px; margin: 18px 0; }
        .wa-divider::before, .wa-divider::after { content: ""; flex: 1; height: 1px; background: #334155; }
        .wa-error { min-height: 18px; margin-top: 10px; color: #fca5a5; font-size: 12px; }
        noscript {
            padding: 18px;
            color: #fca5a5;
        }
    </style>
</head>
<body>
    <header class="designer-header">
        <h1>TSDI Workflow Admin</h1>
        <p>Drag nodes · connect ports · run and inspect path / history / logs</p>
        <div class="designer-lang">
            <span class="designer-auth" id="auth-user" hidden>
                <span id="auth-name"></span>
                <button id="logout" type="button">Sign out</button>
            </span>
        </div>
    </header>
    <div id="boot-status">Loading designer…</div>
    <noscript>This designer requires JavaScript.</noscript>
    <div id="workflow-app"></div>
    <script type="module" src="./main.js"></script>
</body>
</html>
