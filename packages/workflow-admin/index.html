<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" href="data:," />
    <title>TSDI Workflow Admin</title>
    <style>
        /* Shell theme follows the designer theme (`data-theme` is set on <html>
           by applyThemeToDocument), so light/dark/solarized/high-contrast stay
           consistent between the chrome and the canvas. */
        :root {
            --wa-shell-bg: #f8fafc;
            --wa-shell-surface: #ffffff;
            --wa-shell-text: #0f172a;
            --wa-shell-muted: #64748b;
            --wa-shell-border: #e2e8f0;
            --wa-shell-hover: #f1f5f9;
            --wa-shell-accent: #2563eb;
            --wa-shell-accent-text: #ffffff;
            --wa-shell-danger: #dc2626;
            --wa-shell-hero: radial-gradient(circle at 20% 10%, #dbeafe, #f8fafc 55%);
            --wa-shell-shadow: 0 24px 70px rgba(15, 23, 42, 0.18);
        }
        [data-theme="dark"] {
            --wa-shell-bg: #0f172a;
            --wa-shell-surface: #111c33;
            --wa-shell-text: #f8fafc;
            --wa-shell-muted: #94a3b8;
            --wa-shell-border: #1e293b;
            --wa-shell-hover: #1e293b;
            --wa-shell-accent: #60a5fa;
            --wa-shell-accent-text: #0b1220;
            --wa-shell-danger: #fca5a5;
            --wa-shell-hero: radial-gradient(circle at 20% 10%, #1e3a5f, #0b1220 55%);
            --wa-shell-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
        }
        [data-theme="solarized"] {
            --wa-shell-bg: #fdf6e3;
            --wa-shell-surface: #eee8d5;
            --wa-shell-text: #073642;
            --wa-shell-muted: #657b83;
            --wa-shell-border: #d8cfb0;
            --wa-shell-hover: #e7e1cc;
            --wa-shell-accent: #268bd2;
            --wa-shell-accent-text: #fdf6e3;
            --wa-shell-danger: #dc322f;
            --wa-shell-hero: radial-gradient(circle at 20% 10%, #eee8d5, #fdf6e3 55%);
            --wa-shell-shadow: 0 24px 70px rgba(7, 54, 66, 0.22);
        }
        [data-theme="high-contrast"] {
            --wa-shell-bg: #000000;
            --wa-shell-surface: #0a0a0a;
            --wa-shell-text: #ffffff;
            --wa-shell-muted: #e5e5e5;
            --wa-shell-border: #ffffff;
            --wa-shell-hover: #1a1a1a;
            --wa-shell-accent: #ffff00;
            --wa-shell-accent-text: #000000;
            --wa-shell-danger: #ff6b6b;
            --wa-shell-hero: radial-gradient(circle at 20% 10%, #1a1a1a, #000000 55%);
            --wa-shell-shadow: 0 0 0 1px #ffffff;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            background: var(--wa-shell-bg);
            color: var(--wa-shell-text);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
        }
        .designer-header {
            padding: 12px 18px;
            background: var(--wa-shell-surface);
            border-bottom: 1px solid var(--wa-shell-border);
            display: flex;
            align-items: baseline;
            gap: 12px;
            flex-wrap: wrap;
        }
        .designer-header h1 {
            margin: 0;
            font-size: 15px;
            color: var(--wa-shell-text);
        }
        .designer-lang {
            margin-left: auto;
            margin-right: 40px;
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .workflow-management-menu {
            position: fixed;
            top: 8px;
            right: 16px;
            z-index: 80;
        }
        .workflow-management-menu .menu-bar-trigger {
            min-height: 28px;
        }
        .designer-auth[hidden] {
            display: none !important;
        }
        .designer-auth {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: 8px;
            color: var(--wa-shell-muted);
            font-size: 11px;
        }
        .designer-auth button,
        .designer-lang button {
            border: 1px solid var(--wa-shell-border);
            border-radius: 6px;
            background: var(--wa-shell-bg);
            color: var(--wa-shell-muted);
            font-size: 11px;
            padding: 4px 9px;
            cursor: pointer;
        }
        .designer-auth button:hover,
        .designer-lang button:hover {
            border-color: var(--wa-shell-accent);
            color: var(--wa-shell-text);
        }
        #boot-status {
            padding: 18px;
            font-size: 13px;
            color: var(--wa-shell-accent);
        }
        #workflow-app {
            flex: 1;
            min-height: 0;
            background: var(--wa-shell-bg);
            color: var(--wa-shell-text);
        }
        #workflow-app > workflow-designer,
        #workflow-app > workflow-admin-shell,
        #workflow-app workflow-admin-shell,
        #workflow-app workflow-admin-shell > router-outlet,
        #workflow-app workflow-admin-designer,
        #workflow-app workflow-designer {
            display: block;
            height: 100%;
            min-height: 0;
        }
        /* The designer route moves the workflow tab strip into the app header,
           so the page header replaces the static one and the designer loses a
           chrome row. Other routes keep the static brand header. */
        body.wa-designer-route > .designer-header {
            display: none;
        }
        .wa-designer-shell {
            display: flex;
            flex-direction: column;
            height: 100%;
            min-height: 0;
        }
        .wa-designer-shell > .designer-header {
            flex: 0 0 auto;
            flex-wrap: nowrap;
            align-items: center;
            gap: 10px;
            padding: 6px 18px;
        }
        .wa-designer-shell > .designer-header h1 {
            flex: 0 0 auto;
            white-space: nowrap;
        }
        .wa-designer-shell > .designer-header .designer-lang {
            flex: 0 0 auto;
            margin-left: 0;
        }
        /* The strip keeps the shared workflow-tabs skin but maps its palette
           from the shell theme because it sits outside the designer root. */
        .wa-designer-shell .wa-header-tabs {
            flex: 1 1 auto;
            min-width: 0;
            padding: 0;
            background: transparent;
            border-bottom: 0;
            --wf-theme-surface: var(--wa-shell-surface);
            --wf-theme-surface-alt: var(--wa-shell-surface);
            --wf-theme-border: var(--wa-shell-border);
            --wf-theme-text: var(--wa-shell-text);
            --wf-theme-muted: var(--wa-shell-muted);
            --wf-theme-hover: var(--wa-shell-hover);
            --wf-theme-primary: var(--wa-shell-accent);
            --wf-theme-danger: var(--wa-shell-danger);
            --tab-strip-background: transparent;
            --tab-surface: var(--wa-shell-surface);
            --tab-border: var(--wa-shell-border);
            --tab-text: var(--wa-shell-text);
            --tab-muted: var(--wa-shell-muted);
            --tab-hover: var(--wa-shell-hover);
            --tab-accent: var(--wa-shell-accent);
            --tab-danger: var(--wa-shell-danger);
        }
        .wa-designer-shell .wa-header-tabs .tab-bar {
            min-height: 0;
            padding: 0;
            border-bottom: 0;
        }
        .wa-designer-shell .wa-header-tabs .tab {
            border: 1px solid transparent;
            border-radius: 7px;
        }
        .wa-designer-shell .wa-header-tabs .tab[aria-selected="true"] {
            border-color: var(--wa-shell-border);
        }
        .wa-designer-body {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }
        .wa-designer-body > workflow-designer {
            flex: 1 1 auto;
            min-height: 0;
        }
        /* With tabs hosted in the header the global bar only carries the
           subflow breadcrumb; collapse it when there is nothing to show. */
        .wa-designer-shell .workflow-global-bar {
            padding: 0;
            border-bottom: 0;
            gap: 0;
        }
        .wa-designer-shell .workflow-global-bar.has-breadcrumb {
            padding: 3px 8px;
            border-bottom: 1px solid var(--wa-shell-border);
            gap: 8px;
        }
        .wa-login {
            height: 100%;
            display: grid;
            place-items: center;
            padding: 24px;
            background: var(--wa-shell-hero);
        }
        .wa-login-card {
            width: min(420px, calc(100vw - 32px));
            padding: 28px;
            border: 1px solid var(--wa-shell-border);
            border-radius: 16px;
            background: var(--wa-shell-surface);
            box-shadow: var(--wa-shell-shadow);
        }
        .wa-login-card h1 { margin: 0 0 6px; font-size: 20px; }
        .wa-login-card p { margin: 0 0 20px; color: var(--wa-shell-muted); font-size: 12px; }
        .wa-login-card button,
        .wa-login-card input {
            width: 100%;
            padding: 10px 12px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid var(--wa-shell-border);
            background: var(--wa-shell-bg);
            color: var(--wa-shell-text);
            font-size: 13px;
        }
        .wa-login-card button { cursor: pointer; }
        .wa-login-card button.wa-primary {
            background: var(--wa-shell-accent);
            border-color: var(--wa-shell-accent);
            color: var(--wa-shell-accent-text);
            font-weight: 600;
        }
        .wa-login-card label { display: block; margin-top: 12px; color: var(--wa-shell-muted); font-size: 11px; }
        .wa-divider { display: flex; align-items: center; gap: 10px; color: var(--wa-shell-muted); font-size: 11px; margin: 18px 0; }
        .wa-divider::before, .wa-divider::after { content: ""; flex: 1; height: 1px; background: var(--wa-shell-border); }
        .wa-error { min-height: 18px; margin-top: 10px; color: var(--wa-shell-danger); font-size: 12px; }
        .wa-not-found {
            height: 100%;
            display: grid;
            place-items: center;
            padding: 24px;
            background: var(--wa-shell-hero);
        }
        .wa-not-found-card {
            width: min(440px, calc(100vw - 32px));
            padding: 30px;
            border: 1px solid var(--wa-shell-border);
            border-radius: 16px;
            background: var(--wa-shell-surface);
            box-shadow: var(--wa-shell-shadow);
            text-align: center;
        }
        .wa-not-found-code { color: var(--wa-shell-accent); font-size: 52px; font-weight: 800; line-height: 1; }
        .wa-not-found-card h1 { margin: 14px 0 8px; font-size: 20px; }
        .wa-not-found-card p { margin: 0; color: var(--wa-shell-muted); font-size: 12px; }
        .wa-not-found-actions { display: flex; gap: 8px; justify-content: center; margin-top: 22px; }
        .wa-not-found-actions button {
            padding: 9px 12px;
            border: 1px solid var(--wa-shell-border);
            border-radius: 8px;
            background: var(--wa-shell-bg);
            color: var(--wa-shell-text);
            font-size: 12px;
            cursor: pointer;
        }
        .wa-not-found-actions button.wa-primary {
            border-color: var(--wa-shell-accent);
            background: var(--wa-shell-accent);
            color: var(--wa-shell-accent-text);
            font-weight: 600;
        }
        noscript {
            padding: 18px;
            color: var(--wa-shell-danger);
        }

        /* Admin feature pages (Plugins / Sessions / Audit). */
        .wa-page {
            min-height: 100%;
            padding: 24px clamp(16px, 4vw, 48px) 48px;
        }
        .wa-page-header {
            display: flex;
            align-items: flex-end;
            gap: 16px;
            flex-wrap: wrap;
        }
        .wa-page-heading { min-width: 0; }
        .wa-page-back {
            color: var(--wa-shell-muted);
            font-size: 12px;
            text-decoration: none;
        }
        .wa-page-back:hover { color: var(--wa-shell-accent); }
        .wa-page-title {
            margin: 6px 0 0;
            font-size: 22px;
            font-weight: 650;
            color: var(--wa-shell-text);
        }
        .wa-page-subtitle {
            margin: 4px 0 0;
            font-size: 12px;
            color: var(--wa-shell-muted);
        }
        .wa-page-nav {
            margin-left: auto;
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .wa-page-nav-item {
            padding: 6px 10px;
            border-radius: 7px;
            border: 1px solid transparent;
            color: var(--wa-shell-muted);
            font-size: 12px;
            text-decoration: none;
        }
        .wa-page-nav-item:hover {
            border-color: var(--wa-shell-border);
            color: var(--wa-shell-text);
        }
        .wa-page-nav-item.is-active {
            background: var(--wa-shell-accent);
            color: var(--wa-shell-accent-text);
        }
        .wa-page-body {
            margin-top: 20px;
            max-width: 1100px;
        }
        .wa-page-toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .wa-page-search,
        .wa-page-select {
            border: 1px solid var(--wa-shell-border);
            border-radius: 8px;
            background: var(--wa-shell-surface);
            color: var(--wa-shell-text);
            font-size: 13px;
            padding: 7px 10px;
        }
        .wa-page-search { flex: 1 1 260px; max-width: 380px; }
        .wa-page-select { min-width: 150px; }
        .wa-page-action.ui-button,
        .wa-page .ui-button {
            border: 1px solid var(--wa-shell-border);
            border-radius: 7px;
            background: var(--wa-shell-surface);
            color: var(--wa-shell-text);
            font-size: 12px;
            padding: 6px 10px;
            cursor: pointer;
        }
        .wa-page .ui-button:hover { border-color: var(--wa-shell-accent); }
        .wa-page .ui-button.is-disabled { opacity: 0.55; cursor: default; }
        .wa-page-error {
            margin: 0 0 12px;
            padding: 8px 10px;
            border: 1px solid var(--wa-shell-danger);
            border-radius: 8px;
            color: var(--wa-shell-danger);
            font-size: 12px;
        }
        .wa-plugin-list,
        .wa-session-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .wa-plugin-row,
        .wa-session-row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px 14px;
            border: 1px solid var(--wa-shell-border);
            border-radius: 10px;
            background: var(--wa-shell-surface);
        }
        .wa-plugin-main,
        .wa-session-main { flex: 1 1 auto; min-width: 0; }
        .wa-plugin-title,
        .wa-session-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            color: var(--wa-shell-text);
            flex-wrap: wrap;
        }
        .wa-plugin-version,
        .wa-plugin-id,
        .wa-plugin-nodes,
        .wa-session-meta {
            color: var(--wa-shell-muted);
            font-size: 11px;
        }
        .wa-plugin-meta {
            display: flex;
            gap: 10px;
            margin-top: 3px;
        }
        .wa-plugin-description {
            margin: 6px 0 0;
            font-size: 12px;
            color: var(--wa-shell-muted);
        }
        .wa-session-meta {
            display: flex;
            gap: 12px;
            margin-top: 4px;
            flex-wrap: wrap;
        }
        .wa-session-error {
            margin-top: 6px;
            font-size: 12px;
            color: var(--wa-shell-danger);
            overflow-wrap: anywhere;
        }
        .wa-session-status { flex: 0 0 auto; }
        .wa-page .ui-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 2px 8px;
            border-radius: 999px;
            border: 1px solid var(--wa-shell-border);
            font-size: 11px;
            color: var(--wa-shell-muted);
        }
        .wa-page .ui-badge[data-tone="success"] {
            border-color: #16a34a;
            color: #16a34a;
        }
        .wa-page .ui-badge[data-tone="error"] {
            border-color: var(--wa-shell-danger);
            color: var(--wa-shell-danger);
        }
        .wa-page .ui-badge[data-tone="info"] {
            border-color: var(--wa-shell-accent);
            color: var(--wa-shell-accent);
        }
        .wa-page .ui-badge[data-tone="warning"] {
            border-color: #d97706;
            color: #d97706;
        }
        .wa-page .ui-badge-dot {
            width: 6px;
            height: 6px;
            border-radius: 999px;
            background: currentColor;
        }
        .wa-page .ui-data-table {
            border: 1px solid var(--wa-shell-border);
            border-radius: 10px;
            overflow: hidden;
            background: var(--wa-shell-surface);
        }
        .wa-page .ui-data-table-head,
        .wa-page .ui-data-table-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
            padding: 9px 12px;
        }
        .wa-page .ui-data-table-head {
            border-bottom: 1px solid var(--wa-shell-border);
            font-size: 11px;
            font-weight: 600;
            color: var(--wa-shell-muted);
        }
        .wa-page .ui-data-table-row {
            border-bottom: 1px solid var(--wa-shell-border);
            font-size: 12px;
            color: var(--wa-shell-text);
        }
        .wa-page .ui-data-table-row:last-child { border-bottom: 0; }
        .wa-page .ui-data-table-cell { flex: 1 1 0; min-width: 0; overflow-wrap: anywhere; }
        .wa-page .ui-data-table-sep { flex: 0 0 auto; opacity: 0.3; }
        .wa-page .ui-data-table-empty {
            padding: 18px 12px;
            font-size: 12px;
            color: var(--wa-shell-muted);
        }
        .wa-page .ui-empty {
            padding: 32px 16px;
            text-align: center;
            color: var(--wa-shell-muted);
        }
        .wa-page .ui-empty-title { margin: 8px 0 0; font-size: 14px; color: var(--wa-shell-text); }
        .wa-page .ui-empty-hint { margin: 4px 0 0; font-size: 12px; }
        .wa-page-toast {
            position: fixed;
            right: 18px;
            bottom: 18px;
            z-index: 90;
        }
        .wa-page-toast .console-toast-stack { padding: 0; }
        .wa-page-toast .console-toast-card {
            background: var(--wa-shell-surface);
            border: 1px solid var(--wa-shell-border);
            border-radius: 10px;
            box-shadow: var(--wa-shell-shadow);
            padding: 8px 12px;
            max-width: 340px;
        }
        .wa-page-toast .console-toast { font-size: 12px; color: var(--wa-shell-text); }
        .wa-page-toast .console-toast[data-tone="success"] { color: #16a34a; }
        .wa-page-toast .console-toast[data-tone="error"] { color: var(--wa-shell-danger); }
        .wa-page-toast .toast-close { cursor: pointer; color: var(--wa-shell-muted); margin-left: 8px; }
    </style>
</head>
<body>
    <header class="designer-header">
        <h1>TSDI Workflow Admin</h1>
    </header>
    <div id="boot-status">Loading designer…</div>
    <noscript>This designer requires JavaScript.</noscript>
    <div id="workflow-app"></div>
    <script type="module" src="./main.js"></script>
</body>
</html>
