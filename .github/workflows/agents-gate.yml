name: agents-gate

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build agent-cli (for PTY acceptance)
        run: cd packages/agents/agent-cli && npm run build
      - name: Run agents gate
        env:
          RUN_PTY: '1'
        run: bash scripts/agents-gate.sh